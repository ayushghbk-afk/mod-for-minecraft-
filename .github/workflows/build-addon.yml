name: Build Minecraft Bedrock Add-On

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package .mcpack files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find behavior_packs proxy scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 2>/dev/null \
            | xargs -0 -r -n1 node --check

      - name: Build Bedrock packs
        run: npm run build

      - name: Upload Bedrock packs
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-ai-bot-${{ github.sha }}
          path: |
            dist/*.mcpack
            dist/*.mcaddon
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged Bedrock packs
        uses: actions/download-artifact@v4
        with:
          name: autonomous-ai-bot-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.mcpack dist/*.mcaddon \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Autonomous AI Bot ${GITHUB_REF_NAME}" \
            --generate-notes
